name: Build

on:
  push:
    branches: [main, feat/linux-support]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: installer-${{ matrix.platform }}

      - name: Download bundled tools (Windows)
        if: matrix.platform == 'windows-latest'
        run: pnpm download:modpreview

      - name: Install frontend dependencies
        run: pnpm install

      - name: Update Rust dependencies
        run: cd src-tauri && cargo update

      # Tag pushes: build + create GitHub release
      - name: Build and release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'BD2ModManager ${{ github.ref_name }}'
          releaseBody: 'See assets below to download and install.'
          releaseDraft: true
          prerelease: false

      # Branch pushes/PRs: just build
      - name: Build
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npx tauri build

      - name: Upload artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore

  build-portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            asset_pattern: 'BD2ModManager-[version]-portable[ext]'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ''
            asset_pattern: 'BD2ModManager-[version]-portable-linux[ext]'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: portable-${{ matrix.platform }}

      - name: Install frontend dependencies
        run: pnpm install

      - name: Update Rust dependencies
        run: cd src-tauri && cargo update

      # Tag pushes: build portable + attach to release
      - name: Build portable and release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'BD2ModManager ${{ github.ref_name }}'
          releaseBody: 'See assets below to download and install.'
          releaseDraft: true
          args: --no-bundle --features portable
          uploadPlainBinary: true
          assetNamePattern: ${{ matrix.asset_pattern }}

      # Branch pushes/PRs: just build portable
      - name: Build portable
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npx tauri build -- --no-bundle --features portable

      - name: Upload portable artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: |
            src-tauri/target/release/BD2ModManager*
            src-tauri/target/release/bd2modmanager*
            !src-tauri/target/release/*.d
            !src-tauri/target/release/build/
            !src-tauri/target/release/deps/
            !src-tauri/target/release/.fingerprint/
          if-no-files-found: ignore
