name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  build-installer:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: download bundled tools
        if: matrix.platform == 'windows-latest'
        run: pnpm download:modpreview

      - name: install frontend dependencies
        run: pnpm install

      - name: Update Rust dependencies
        run: cd src-tauri && cargo update

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: 'See assets below to download and install.'
          releaseDraft: true

  build-portable:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            asset_pattern: 'BD2ModManager-[version]-portable[ext]'
          - platform: ubuntu-22.04
            asset_pattern: 'BD2ModManager-[version]-portable-linux[ext]'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: download bundled tools
        if: matrix.platform == 'windows-latest'
        run: pnpm download:modpreview

      - name: install frontend dependencies
        run: pnpm install

      - name: Update Rust dependencies
        run: cd src-tauri && cargo update

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: 'See assets below to download and install.'
          releaseDraft: true
          args: --no-bundle --features portable
          uploadPlainBinary: true
          assetNamePattern: ${{ matrix.asset_pattern }}
